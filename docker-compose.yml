services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/bisleri
      - JWT_SECRET=change_this_in_production
      - JWT_EXPIRE=7d
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5000
    depends_on:
      - mongodb

volumes:
  mongo_data:
